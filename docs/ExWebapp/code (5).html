<!-- Micro-interaction Script -->
<script>
        // Simple entrance animation for the modal
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.querySelector('.glass-card');
            modal.style.opacity = '0';
            modal.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                modal.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                modal.style.opacity = '1';
                modal.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });

        // Toggle hover effect on button
        const mainBtn = document.querySelector('button.bg-primary');
        mainBtn.addEventListener('mousemove', (e) => {
            const rect = mainBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            mainBtn.style.setProperty('--x', `${x}px`);
            mainBtn.style.setProperty('--y', `${y}px`);
        });
    </script>
